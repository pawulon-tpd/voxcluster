[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxcluster"
version = "0.1.0"
description = "Cluster molecules by voxelised 3D occupancy: RDKit conformers, shape alignment, pharmacophore grids"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pawel" }]
keywords = ["cheminformatics", "conformers", "voxel", "shape-similarity", "clustering", "rdkit"]
dependencies = [
    "voxorcist @ git+https://github.com/pawulon-tpd/voxorcist.git",
    "rdkit>=2024.9",          # rdShapeAlign
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
app = ["gradio>=6.0", "matplotlib>=3.8"]
# Vina itself: PyPI wheels exist for Linux x86_64 only; elsewhere use the official binary
# (https://github.com/ccsb-scripps/AutoDock-Vina/releases). meeko imports gemmi undeclared.
docking = [
    "meeko>=0.8",
    "gemmi",
    "vina>=1.2.5; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/pawulon-tpd/voxcluster"

[tool.setuptools.packages.find]
include = ["voxcluster*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["voxcluster"]
